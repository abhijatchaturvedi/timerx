[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "timerx"
version = "0.4.0"
description = "Tiny dependency-free timing decorator, context manager, and stopwatch utility."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Abhijat Chaturvedi" }
]
keywords = [
  "timer",
  "timing",
  "benchmark",
  "decorator",
  "context-manager",
  "stopwatch",
  "profiling",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Benchmark",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/abhijatchaturvedi/timerx"
Repository = "https://github.com/abhijatchaturvedi/timerx"
Issues = "https://github.com/abhijatchaturvedi/timerx/issues"

[tool.hatch.build.targets.wheel]
packages = ["timerx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
